<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading… — JPAG</title>
  <meta name="description" content="" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <!-- Reuse root variables and nav/footer styles from main site -->
  <link rel="stylesheet" href="../style.css" />
  <!-- Post-specific reading typography -->
  <link rel="stylesheet" href="post.css" />
  <!-- marked.js — Markdown parser, no build step needed -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>

  <!-- ── Navigation ─────────────────────────────────────── -->
  <nav class="nav" id="nav" role="navigation" aria-label="Primary navigation">
    <div class="nav-inner">
      <a href="../" class="nav-logo" id="nav-logo" aria-label="JPAG — Back to home">
        <span class="nav-logo-text">JPAG</span>
      </a>
      <div class="nav-links" role="list">
        <a href="../#work"    class="nav-link" role="listitem">Work</a>
        <a href="../#about"   class="nav-link" role="listitem">About</a>
        <a href="../#writing" class="nav-link nav-link--writing active" role="listitem">Writing</a>
        <a href="../#contact" class="nav-link" role="listitem">Contact</a>
      </div>
      <a href="mailto:hello@jpag.dev" class="nav-status" aria-label="Available for work">
        <span class="status-dot" aria-hidden="true"></span>
        Available
      </a>
    </div>
  </nav>

  <!-- ── Post ───────────────────────────────────────────── -->
  <main class="post-main" id="post-main">
    <div class="post-container">

      <a href="../#writing" class="post-back mono" id="post-back">← Writing</a>

      <header id="post-header">
        <div class="post-meta" id="post-meta" aria-label="Post metadata">
          <span id="post-date"></span>
          <span id="post-read"></span>
        </div>
        <h1 class="post-title" id="post-title">Loading…</h1>
      </header>

      <article class="post-body" id="post-body" aria-label="Post content">
        <!-- JS renders markdown here -->
      </article>

      <footer class="post-footer">
        <a href="../#writing" class="post-back-footer mono">← Back to all posts</a>
      </footer>

    </div>
  </main>

  <script>
    /* ── Nav scroll state ─────────────────────────────── */
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 40);
    }, { passive: true });

    /* ── Front-matter parser ──────────────────────────── */
    function parseFrontMatter(raw) {
      const match = raw.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
      if (!match) return { meta: {}, content: raw };
      const meta = {};
      match[1].split('\n').forEach(line => {
        const colon = line.indexOf(':');
        if (colon === -1) return;
        const key = line.slice(0, colon).trim();
        const val = line.slice(colon + 1).trim();
        if (key) meta[key] = val;
      });
      return { meta, content: match[2] };
    }

    /* ── Load and render post ─────────────────────────── */
    async function loadPost() {
      const params = new URLSearchParams(window.location.search);
      const slug   = params.get('post');

      if (!slug) {
        setError('No post specified.');
        return;
      }

      try {
        const res = await fetch(`posts/${slug}.md`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const raw = await res.text();

        const { meta, content } = parseFrontMatter(raw);

        /* ── Page metadata ── */
        const title = meta.title || slug;
        document.title                                              = title + ' — JPAG';
        document.querySelector('meta[name="description"]').content = meta.excerpt || '';

        /* ── Header ── */
        document.getElementById('post-title').textContent = title;
        document.getElementById('post-date').textContent  = meta.date     || '';
        document.getElementById('post-read').textContent  = meta.readTime || '';

        /* ── Body ── */
        marked.setOptions({ breaks: false, gfm: true });
        document.getElementById('post-body').innerHTML = marked.parse(content);

      } catch (err) {
        console.error('[post.html] Failed to load post:', err);
        setError('Post not found or could not be loaded.');
      }
    }

    function setError(msg) {
      document.getElementById('post-title').textContent      = '404';
      document.getElementById('post-body').innerHTML = `<p class="post-error">${msg}</p>`;
    }

    loadPost();
  </script>

</body>
</html>
